services:
  db:
    image: postgres:18-alpine
    container_name: warehouse-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Definir POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en 5432
      - "5433:5432"
    volumes:
      # PG 18+ monta en el directorio padre para permitir upgrades con pg_upgrade
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      # Secreto de firma JWT: la API no arranca sin él (mínimo 32 caracteres).
      Auth__Secret: ${AUTH_SECRET:?Definir AUTH_SECRET en .env}
      # Opcional: orígenes con acceso cross-origin en Production.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "5259:8080"

volumes:
  pgdata:
