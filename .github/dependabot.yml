version: 2
updates:
    # Paquetes NuGet: la solución está en la raíz y referencia los 10 .csproj.
    - package-ecosystem: nuget
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - dotnet
      commit-message:
          prefix: chore
          include: scope

    # Acciones de GitHub (actions/checkout, actions/cache, ...).
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - ci
      commit-message:
          prefix: ci
          include: scope
